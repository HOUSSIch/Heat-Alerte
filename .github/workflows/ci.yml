name: HeatAlert CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/devops-pipeline

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and static analysis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: heatalert_test
          MYSQL_USER: heatalert
          MYSQL_PASSWORD: heatalert
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: heatalert_test
      DB_USERNAME: heatalert
      DB_PASSWORD: heatalert
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          extensions: mbstring, pdo_mysql
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Run tests and generate coverage
        run: php -d pcov.enabled=1 artisan test --coverage-clover=coverage.xml

      - name: Check Laravel Pint formatting
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud Quality Gate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover

      - name: Check SonarQube Cloud configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube Cloud is not configured; analysis is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyse SonarQube Cloud and wait for the Quality Gate
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
